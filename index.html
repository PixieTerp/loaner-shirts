<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loaner Shirt Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style id="appstyle">
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--muted:#6b7280;--line:#e6e2d8;--blue:#2457c5;--blue2:#e8eefc;--orange:#f08a24;--red:#c8332b;--red2:#fdecea;--green:#1f8a4c;--green2:#e6f5ec;--amber:#b86e00;--amber2:#fff4e0}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:26px;margin:0 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px}
.banner{background:var(--amber2);border:1px solid #f3cf8f;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.step{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.step.done .num{background:var(--green)}
.step h3{margin:3px 0 8px;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.chip.on{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
.chip small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
input[type=text],input[type=number]{font:inherit;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:20px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.help{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.alert{border-radius:12px;padding:12px 14px;margin-top:10px;font-weight:600}
.alert.warn{background:var(--amber2);border:1px solid #f3cf8f;color:#6b4300}
.alert.stop{background:var(--red2);border:2px solid var(--red);color:var(--red)}
.alert.ok{background:var(--green2);color:var(--green)}
.alert b.big{font-size:19px;display:block;margin-bottom:2px}
.check{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:700;cursor:pointer;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.check input{width:24px;height:24px}
.check.on{border-color:var(--green);background:var(--green2)}
.locker{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 9px;font-weight:800}
.go{width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:20px;font-weight:800;background:var(--orange);color:#fff;cursor:pointer}
.go:disabled{background:#d9d4c8;cursor:not-allowed}
.go.red{background:var(--red)}
button{font:inherit;cursor:pointer;color:var(--ink);-webkit-text-fill-color:currentColor}
input,select,textarea{color:var(--ink)}
.logo{height:44px;width:auto;flex:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 2px}
.head h1{margin:0}
@media(max-width:420px){.logo{height:32px}.head h1{font-size:22px}}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--blue);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:28px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--red)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);font-size:15px}
th{background:#faf8f3;border-top:0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.n{font-weight:800;font-size:18px}
tr.lvl1 td{background:var(--amber2)}
tr.lvl2 td{background:var(--red2)}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px;background:var(--red);color:#fff}
.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:14px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.bar input[type=text]{font-size:16px;padding:9px 12px;flex:1;min-width:180px}
h2{font-size:19px;margin:18px 0 8px}
#qr{display:flex;justify-content:center;padding:14px;background:#fff}
#qr img,#qr canvas{width:260px;height:260px}
.modal-bg{position:fixed;inset:0;background:rgba(20,22,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%}
.modal h3{margin:0 0 8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal input[type=text]{font-size:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;z-index:10;text-align:center}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}th,td{padding:8px;font-size:14px}}
</style>
<script id="state" type="application/json">{"students":[],"log":[],"nextId":1}</script>
</head>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=iso=>{const d=new Date(iso);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})};
const fmtD=iso=>new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const count=id=>S.log.filter(l=>l.id===id).length;
const lastOf=id=>{for(let i=S.log.length-1;i>=0;i--)if(S.log[i].id===id)return S.log[i];return null};
const byId=id=>S.students.find(s=>s.id===id);
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();

// "maria lopez" / "Maria L" / "maria l." -> {first:'Maria', li:'L', display:'Maria L.'}
function parseName(raw){
  const parts=raw.trim().replace(/[.,]/g,' ').split(/\s+/).filter(Boolean);
  if(parts.length<2)return null;
  const first=parts.slice(0,-1).map(cap).join(' ');
  const li=parts[parts.length-1].charAt(0).toUpperCase();
  if(!/[A-Z]/.test(li))return null;
  return {first,li,display:first+' '+li+'.',key:(first+'|'+li).toLowerCase()};
}
const keyOf=s=>(s.first+'|'+s.li).toLowerCase();
const findStudent=p=>p&&S.students.find(s=>keyOf(s)===p.key);

}

  if(mode!=='shared')return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    publishing=true;render();
    try{await art.publish(buildDoc())}
    catch(e){const m=String(e&&(e.code||e.message)||e);
      if(/not_granted|not_writer/.test(m)){mode='readonly';toast("View-only: this device can't save")}
      else if(!/conflict/.test(m))toast('Save failed — try again')}
    publishing=false;render();
  },700);
}
let toastT;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.innerHTML=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)}
function modal(title,html,buttons){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML='<div class="modal"><h3>'+esc(title)+'</h3><div>'+html+'</div><div class="acts"></div></div>';
  const acts=bg.querySelector('.acts');
  buttons.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.label;el.onclick=()=>{if(b.run&&b.run(bg)===false)return;bg.remove()};acts.appendChild(el)});
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});
  document.body.appendChild(bg);const f=bg.querySelector('input');if(f)f.focus();
}

function record(){
  const p=parseName(ui.name);if(!p||!ui.bag)return;
  let s=findStudent(p);
  if(!s){s={id:S.nextId++,first:p.first,li:p.li};S.students.push(s)}
  const sess=ui.days+' '+ui.time;
  S.log.push({id:s.id,t:new Date().toISOString(),sess,bag:true});
  const n=count(s.id);
  ui.name='';ui.bag=false;
  save();render();
  toast('👕 Loaner #'+n+' recorded for '+esc(s.first+' '+s.li+'.')+'<br>Put the bag in locker <b>'+s.li+'</b> after school');
  const f=document.getElementById('nm');if(f)f.focus();
}

function render(){
  keepUI();
  const root=document.getElementById('root');
  let h='<div class="wrap"><div class="head"><h1>👕 Loaner Shirt Tracker</h1><img class="logo" alt="ThrivePoint Academy of Nevada" src="'+LOGO+'"></div><p class="sub">Check out a loaner shirt in 3 steps.'+(publishing?' <i>· saving…</i>':'')+'</p>';
  if(mode==='local')h+='<div class="banner">Saving on this device only — records here won\'t show up on other phones or computers.</div>';
  if(mode==='readonly')h+='<div class="banner">View-only on this device — loaners recorded here won\'t be saved.</div>';
  h+='<div class="tabs">'+[['give','Check out a shirt'],['report','Counts & sessions'],['log','History'],['qr','QR code'],['students','Fix names']].map(t=>'<button class="tab'+(ui.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(ui.tab==='give')h+=giveHTML();
  if(ui.tab==='report')h+=reportHTML();
  if(ui.tab==='log')h+=logHTML();
  if(ui.tab==='qr')h+=qrHTML();
  if(ui.tab==='students')h+=studentsHTML();
  h+='</div>';
  root.innerHTML=h;
  if(ui.tab==='qr')drawQR();
}

function giveHTML(){
  const p=parseName(ui.name), s=findStudent(p), n=s?count(s.id):0, last=s?lastOf(s.id):null;
  let h='<div class="card">';
  // Step 1 session
  h+='<div class="step done"><div class="num">1</div><div style="flex:1"><h3>Which session?</h3><div class="chips">'+
     ['MW','TTh'].map(d=>'<button class="chip'+(ui.days===d?' on':'')+'" data-days="'+d+'">'+d+'</button>').join('')+
     
     [['AM','8–11am'],['PM','12–3pm']].map(t=>'<button class="chip'+(ui.time===t[0]?' on':'')+'" data-time="'+t[0]+'">'+t[0]+'<small>'+t[1]+'</small></button>').join('')+
     '</div><p class="help">Picked automatically from today\'s day and time — tap to change.</p></div></div>';
  // Step 2 name
  h+='<div class="step'+(p?' done':'')+'"><div class="num">2</div><div style="flex:1"><h3>First name + first letter of last name</h3>'+
     '<input id="nm" type="text" placeholder="e.g. Maria L" value="'+esc(ui.name)+'" autocomplete="off" autocapitalize="words">';
  const q=ui.name.trim().toLowerCase();
  if(q&&!p){
    const m=S.students.filter(x=>(x.first+' '+x.li).toLowerCase().startsWith(q)).slice(0,6);
    if(m.length)h+='<div class="sugg">'+m.map(x=>'<button data-pick="'+x.id+'">'+esc(x.first+' '+x.li+'.')+' · '+count(x.id)+'</button>').join('')+'</div>';
    h+='<p class="help">Add a space and the first letter of their last name.</p>';
  }
  if(p){
    h+='<p class="help">Shirt goes in locker <span class="locker">'+p.li+'</span></p>';
    if(n===0)h+='<div class="alert ok">✓ First loaner for '+esc(p.display)+'</div>';
    else if(n===1)h+='<div class="alert warn"><b class="big">⚠️ '+esc(p.display)+' already has 1 loaner shirt.</b>Last one: '+esc(fmt(last.t))+(last.sess?' ('+esc(last.sess)+')':'')+'. It should be in locker <span class="locker">'+p.li+'</span> — check there first!</div>';
    else h+='<div class="alert stop"><b class="big">🛑 This would be loaner #'+(n+1)+' for '+esc(p.display)+'!</b>They already got '+n+' shirts. Last one: '+esc(fmt(last.t))+(last.sess?' ('+esc(last.sess)+')':'')+'. Check locker <span class="locker">'+p.li+'</span> before giving another.</div>';
  }
  h+='</div></div>';
  // Step 3 bag
  h+='<div class="step'+(ui.bag?' done':'')+'"><div class="num">3</div><div style="flex:1"><h3>Bag check</h3>'+
     '<label class="check'+(ui.bag?' on':'')+'"><input type="checkbox" id="bag"'+(ui.bag?' checked':'')+'> I gave a bag and wrote the name on it</label>'+
     '<p class="help">Tell the student: put the shirt in the bag and leave it in locker <b>'+(p?p.li:'(last initial)')+'</b> after school.</p></div></div>';
  const ready=p&&ui.bag;
  h+='<button class="go'+(n>=2?' red':'')+'" id="go"'+(ready?'':' disabled')+'>'+(ready?(n>=2?'Give loaner #'+(n+1)+' anyway':'Record loaner shirt'):(!p?'Type a name first':'Tick the bag box to record'))+'</button>';
  h+='</div>';
  // today mini-stat
  const td=new Date().toDateString();
  const todayLogs=S.log.filter(l=>new Date(l.t).toDateString()===td);
  h+='<p class="help" style="text-align:center">Today: '+todayLogs.length+' loaner'+(todayLogs.length===1?'':'s')+' · this session ('+ui.days+' '+ui.time+'): '+todayLogs.filter(l=>l.sess===ui.days+' '+ui.time).length+'</p>';
  return h;
}

function reportHTML(){
  const total=S.log.length, kids=new Set(S.log.map(l=>l.id)).size;
  const repeat=S.students.filter(s=>count(s.id)>=2).length;
  let h='<div class="stats"><div class="stat"><b>'+total+'</b><span>loaner shirts total</span></div>'+
    '<div class="stat"><b>'+kids+'</b><span>students got a loaner</span></div>'+
    '<div class="stat'+(repeat?' warn':'')+'"><b>'+repeat+'</b><span>students with 2+</span></div></div>';
  h+='<h2>By session</h2><table><tr><th>Session</th><th>Students</th><th>Shirts</th></tr>';
  SESS.forEach(se=>{const L=S.log.filter(l=>l.sess===se);h+='<tr><td><b>'+se+'</b></td><td class="n">'+new Set(L.map(l=>l.id)).size+'</td><td class="n">'+L.length+'</td></tr>'});
  const other=S.log.filter(l=>!SESS.includes(l.sess));
  if(other.length)h+='<tr><td>No session</td><td class="n">'+new Set(other.map(l=>l.id)).size+'</td><td class="n">'+other.length+'</td></tr>';
  h+='<tr><td><b>Total</b></td><td class="n">'+kids+'</td><td class="n">'+total+'</td></tr></table>';
  h+='<h2>Students</h2>';
  const got=S.students.filter(s=>count(s.id)>0).sort((a,b)=>count(b.id)-count(a.id)||a.first.localeCompare(b.first));
  if(!got.length)return h+'<div class="empty">No loaners yet.</div>';
  h+='<div class="bar"><button class="btn ghost" data-a="copy">Copy list</button></div>';
  h+='<table><tr><th>Student</th><th>Locker</th><th>Loaners</th><th>Sessions</th><th>Last</th></tr>';
  got.forEach(s=>{const n=count(s.id),L=S.log.filter(l=>l.id===s.id);const ss=[...new Set(L.map(l=>l.sess).filter(Boolean))].join(', ');
    h+='<tr class="'+(n>=3?'lvl2':n===2?'lvl1':'')+'"><td><b>'+esc(s.first+' '+s.li+'.')+'</b>'+(n>=3?'<span class="tag">'+n+' SHIRTS</span>':'')+'</td><td><span class="locker">'+s.li+'</span></td><td class="n">'+n+'</td><td>'+esc(ss||'—')+'</td><td>'+esc(fmtD(L[L.length-1].t))+'</td></tr>'});
  return h+'</table>';
}

function logHTML(){
  if(!S.log.length)return '<div class="empty">No loaners recorded yet.</div>';
  const q=ui.q.trim().toLowerCase();
  let h='<div class="bar"><input type="text" id="lq" placeholder="Filter by name or session…" value="'+esc(ui.q)+'"></div><table><tr><th>When</th><th>Session</th><th>Student</th><th>Bag</th><th></th></tr>';
  for(let i=S.log.length-1;i>=0;i--){const l=S.log[i],s=byId(l.id);const nm=s?s.first+' '+s.li+'.':'(removed)';
    if(q&&!(nm.toLowerCase().includes(q)||(l.sess||'').toLowerCase().includes(q)))continue;
    h+='<tr><td>'+esc(fmt(l.t))+'</td><td>'+esc(l.sess||'—')+'</td><td><b>'+esc(nm)+'</b></td><td>'+(l.bag?'✓':'')+'</td><td><button class="btn sm ghost" data-a="dellog" data-i="'+i+'">Delete</button></td></tr>'}
  return h+'</table>';
}

function qrHTML(){
  return '<div class="card"><h3 style="margin-top:0;text-align:center">Scan to check out</h3><div id="qr"></div>'+
    '<p class="help">Print this or keep it on your desk. Scanning opens this app.</p>'+
    '<p class="help">App link: <b id="qrurl"></b></p></div>';
}
function appUrl(){return mode==='shared'?'https://claude.ai/artifact/8wS5HRaGfEwJQUrXD66Ee1':location.href.split('#')[0]}
function drawQR(){
  const el=document.getElementById('qr');const u=document.getElementById('qrurl');if(u)u.textContent=appUrl();
  if(!el)return;
  if(window.QRCode){try{new QRCode(el,{text:appUrl(),width:520,height:520,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR code could not load.'}}
  else el.textContent='QR code could not load.';
}

function studentsHTML(){
  let h='<p class="help" style="margin-bottom:10px">Fix a typo (like "Mraia L.") or merge two spellings of the same student.</p>';
  if(!S.students.length)return h+'<div class="empty">No students yet — they\'re added the first time they check out a shirt.</div>';
  h+='<table><tr><th>Student</th><th>Loaners</th><th></th></tr>';
  S.students.slice().sort((a,b)=>a.first.localeCompare(b.first)).forEach(s=>{
    h+='<tr><td><b>'+esc(s.first+' '+s.li+'.')+'</b></td><td class="n">'+count(s.id)+'</td><td style="text-align:right"><button class="btn sm ghost" data-a="rename" data-id="'+s.id+'">Rename / merge</button> <button class="btn sm ghost" data-a="remove" data-id="'+s.id+'">Delete</button></td></tr>'});
  h+='</table><h2>Start over</h2><p class="help">New semester? Clear everything.</p><button class="btn red" data-a="reset" style="margin-top:8px">Clear all data</button>';
  return h;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-a],[data-days],[data-time],[data-pick],#go');if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;render();return}
  if(t.dataset.days){ui.days=t.dataset.days;render();return}
  if(t.dataset.time){ui.time=t.dataset.time;render();return}
  if(t.dataset.pick){const s=byId(+t.dataset.pick);ui.name=s.first+' '+s.li;render();return}
  if(t.id==='go'){record();return}
  const a=t.dataset.a,id=+t.dataset.id;
  if(a==='dellog'){S.log.splice(+t.dataset.i,1);save();render()}
  if(a==='copy'){
    const got=S.students.filter(s=>count(s.id)>0).sort((a,b)=>count(b.id)-count(a.id));
    let txt='Loaner shirts — '+new Date().toLocaleDateString('en-US')+'\nTotal: '+S.log.length+' shirts, '+new Set(S.log.map(l=>l.id)).size+' students\n';
    SESS.forEach(se=>{const L=S.log.filter(l=>l.sess===se);txt+=se+': '+new Set(L.map(l=>l.id)).size+' students, '+L.length+' shirts\n'});
    txt+='\n'+got.map(s=>s.first+' '+s.li+'. — '+count(s.id)).join('\n');
    navigator.clipboard.writeText(txt).then(()=>toast('Copied!'),()=>toast('Copy blocked on this device'));
  }
  if(a==='rename'){const s=byId(id);
    modal('Rename '+s.first+' '+s.li+'.','<p>New first name + last initial:</p><input type="text" id="rn" value="'+esc(s.first+' '+s.li)+'"><p class="help">If that name already exists, the two will be merged.</p>',
      [{label:'Cancel',cls:'ghost'},{label:'Save',run:bg=>{const p=parseName(bg.querySelector('#rn').value);if(!p)return false;
        const other=S.students.find(x=>x.id!==id&&keyOf(x)===p.key);
        if(other){S.log.forEach(l=>{if(l.id===id)l.id=other.id});S.students=S.students.filter(x=>x.id!==id)}else{s.first=p.first;s.li=p.li}
        save();render()}}])}
  if(a==='remove'){const s=byId(id);modal('Delete '+s.first+' '+s.li+'.?','<p>This also deletes their '+count(id)+' loaner record(s).</p>',[{label:'Cancel',cls:'ghost'},{label:'Delete',cls:'red',run:()=>{S.students=S.students.filter(x=>x.id!==id);S.log=S.log.filter(l=>l.id!==id);save();render()}}])}
  if(a==='reset'){modal('Clear ALL data?','<p>Type <b>CLEAR</b> to confirm.</p><input type="text" id="cf">',[{label:'Cancel',cls:'ghost'},{label:'Clear',cls:'red',run:bg=>{if(bg.querySelector('#cf').value.trim().toUpperCase()!=='CLEAR')return false;S.log=[];S.students=[];save();render()}}])}
});
document.addEventListener('change',e=>{if(e.target.id==='bag'){ui.bag=e.target.checked;render()}});
document.addEventListener('input',e=>{
  if(e.target.id==='nm'||e.target.id==='lq'){
    const idn=e.target.id,pos=e.target.selectionStart;
    if(idn==='nm')ui.name=e.target.value;else ui.q=e.target.value;
    render();const f=document.getElementById(idn);if(f){f.focus();f.setSelectionRange(pos,pos)}
  }
});
document.addEventListener('keydown',e=>{if(e.target.id==='nm'&&e.key==='Enter'){const b=document.getElementById('bag');if(b)b.focus()}});

render();
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(x=>{if(x){art=x;mode='shared'}else loadLocal();render()}).catch(()=>{loadLocal();render()});
}else{loadLocal();render()}
})();
</script>
</body>
</html>
